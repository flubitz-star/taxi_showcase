bundle:
  name: taxi_showcase

include:
  - resources/*.yml

artifacts:
  taxi_showcase:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --wheel-dir dist

variables:
  catalog:
    description: "Unity Catalog der Umgebung (bronze/silver/gold/raw_files-Tracking)"
    default: taxi_dev
  landing_catalog:
    description: "Katalog mit der gemeinsamen Landing Zone (Volume raw_files.landing_zone)"
    default: workspace

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: DEFAULT
    variables:
      catalog: taxi_dev

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: taxi_prod
