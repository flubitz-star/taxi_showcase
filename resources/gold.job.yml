resources:
  jobs:
    gold:
      name: "Gold Pipeline (Taxi x Weather + Mobility)"

      job_clusters:
        - job_cluster_key: default
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            auto_scale:
              min_workers: 1
              max_workers: 4

      tasks:
        - task_key: gold_taxi_weather
          job_cluster_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/gold_taxi_weather.py
          libraries:
            - whl: ../dist/taxi_showcase-0.1.0-py3-none-any.whl

        - task_key: gold_mobility
          depends_on:
            - task_key: gold_taxi_weather
          job_cluster_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/gold_mobility.py
          libraries:
            - whl: ../dist/taxi_showcase-0.1.0-py3-none-any.whl
