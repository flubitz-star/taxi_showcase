resources:
  jobs:
    gold:
      name: "Gold Pipeline (Taxi x Weather + Mobility)"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.artifact_path}/.internal/taxi_showcase-0.1.0-py3-none-any.whl"

      tasks:
        - task_key: gold_taxi_weather
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/gold_taxi_weather.py

        - task_key: gold_mobility
          depends_on:
            - task_key: gold_taxi_weather
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/gold_mobility.py
