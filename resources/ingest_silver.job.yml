resources:
  jobs:
    ingest_silver:
      name: "Ingest & Silver Pipeline (Weather + Taxi + Bike)"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.artifact_path}/.internal/taxi_showcase-0.1.0-py3-none-any.whl"

      tasks:
        # ── Weather chain ──
        - task_key: weather_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/landing_zone.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        # Skip Bronze and Silver when the landing zone has nothing new to load.
        - task_key: weather_has_new_files
          depends_on:
            - task_key: weather_landing_zone
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.weather_landing_zone.values.pending_files}}"
            right: "0"

        - task_key: weather_bronze
          depends_on:
            - task_key: weather_has_new_files
              outcome: "true"
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: weather_silver
          depends_on:
            - task_key: weather_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/silver.py
            parameters: ["--catalog", "${var.catalog}"]

        # ── Taxi chain ──
        - task_key: taxi_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/landing_zone.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        # Skip Bronze and Silver when the landing zone has nothing new to load.
        - task_key: taxi_has_new_files
          depends_on:
            - task_key: taxi_landing_zone
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.taxi_landing_zone.values.pending_files}}"
            right: "0"

        - task_key: taxi_bronze
          depends_on:
            - task_key: taxi_has_new_files
              outcome: "true"
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: taxi_silver
          depends_on:
            - task_key: taxi_bronze
            - task_key: taxi_streaming_bronze
          run_if: AT_LEAST_ONE_SUCCESS
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/silver.py
            parameters: ["--catalog", "${var.catalog}"]

        # ── Taxi streaming MVP (Auto Loader -> separate streaming Bronze) ──
        - task_key: taxi_streaming_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/streaming_bronze.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        # ── Bike chain ──
        - task_key: bike_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/landing_zone.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        # Skip Bronze and Silver when the landing zone has nothing new to load.
        - task_key: bike_has_new_files
          depends_on:
            - task_key: bike_landing_zone
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.bike_landing_zone.values.pending_files}}"
            right: "0"

        - task_key: bike_bronze
          depends_on:
            - task_key: bike_has_new_files
              outcome: "true"
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: bike_silver
          depends_on:
            - task_key: bike_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/silver.py
            parameters: ["--catalog", "${var.catalog}"]
