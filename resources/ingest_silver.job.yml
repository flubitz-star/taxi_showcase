resources:
  jobs:
    ingest_silver:
      name: "Ingest & Silver Pipeline (Weather + Taxi + Bike)"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.artifact_path}/.internal/taxi_showcase-0.1.0-py3-none-any.whl"

      tasks:
        # ── Weather chain ──
        - task_key: weather_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/landing_zone.py

        - task_key: weather_ingress
          depends_on:
            - task_key: weather_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/ingress.py

        - task_key: weather_silver
          depends_on:
            - task_key: weather_ingress
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/silver.py

        # ── Taxi chain ──
        - task_key: taxi_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/landing_zone.py

        - task_key: taxi_ingress
          depends_on:
            - task_key: taxi_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/ingress.py

        - task_key: taxi_silver
          depends_on:
            - task_key: taxi_ingress
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/silver.py

        # ── Bike chain ──
        - task_key: bike_ingress
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/ingress.py

        - task_key: bike_silver
          depends_on:
            - task_key: bike_ingress
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/silver.py
