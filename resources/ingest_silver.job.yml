resources:
  jobs:
    ingest_silver:
      name: "Ingest & Silver Pipeline (Weather + Taxi + Bike)"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.artifact_path}/.internal/taxi_showcase-0.1.0-py3-none-any.whl"

      tasks:
        # ── Weather chain ──
        - task_key: weather_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/landing_zone.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        - task_key: weather_bronze
          depends_on:
            - task_key: weather_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: weather_silver
          depends_on:
            - task_key: weather_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/weather/silver.py
            parameters: ["--catalog", "${var.catalog}"]

        # ── Taxi chain ──
        - task_key: taxi_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/landing_zone.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        - task_key: taxi_bronze
          depends_on:
            - task_key: taxi_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: taxi_silver
          depends_on:
            - task_key: taxi_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/taxi/silver.py
            parameters: ["--catalog", "${var.catalog}"]

        # ── Bike chain ──
        - task_key: bike_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/landing_zone.py
            parameters: ["--catalog", "${var.catalog}", "--landing-catalog", "${var.landing_catalog}"]

        - task_key: bike_bronze
          depends_on:
            - task_key: bike_landing_zone
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: bike_silver
          depends_on:
            - task_key: bike_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/taxi_showcase/pipelines/bike/silver.py
            parameters: ["--catalog", "${var.catalog}"]
